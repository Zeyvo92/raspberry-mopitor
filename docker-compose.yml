services:
  raspberry-mopitor:
    build: .
    container_name: raspberry-mopitor
    restart: unless-stopped
    # host network + pid: metrics reflect the real Pi, not the container,
    # and the port is exposed directly (http://<pi>:8585)
    network_mode: host
    pid: host
    environment:
      PORT: "8585"
      REFRESH_INTERVAL_MS: "1000"
      # host root is mounted read-only below; report its disk usage
      DISK_PATH: /host
    volumes:
      - /:/host:ro
