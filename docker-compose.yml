# Default deployment: prebuilt multi-arch image from GHCR.
#   start:  docker compose up -d
#   update: docker compose pull && docker compose up -d
# To build from source instead, use docker-compose.build.yml.
services:
  raspberry-mopitor:
    image: ghcr.io/zeyvo92/raspberry-mopitor:latest
    container_name: raspberry-mopitor
    restart: unless-stopped
    # host network + pid: metrics reflect the real Pi, not the container,
    # and the port is exposed directly (http://<pi>:8585)
    network_mode: host
    pid: host
    environment:
      PORT: "8585"
      REFRESH_INTERVAL_MS: "1000"
      # host root is mounted read-only below: filesystem usage, os-release
      # and — where the container's own /sys hides it — the firmware throttle
      # register are read from there, so they reflect the Pi, not the container
      DISK_PATH: /host
      HOST_ROOT: /host
      # history: one sample every 10s, kept a week (~5 MB of SQLite)
      HISTORY_INTERVAL_MS: "10000"
      HISTORY_RETENTION_HOURS: "168"
    volumes:
      - /:/host:ro
      # keeps the history database across container updates
      - mopitor-data:/data
      # The Containers tab needs the Docker socket. Mounting it hands this
      # container root-equivalent control of the daemon, so it is opt-in:
      # uncomment the mount *and* group_add with your host's docker group id
      # (getent group docker | cut -d: -f3) so the unprivileged "node" user
      # is allowed to read the socket.
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    # group_add:
    #   - "999"

volumes:
  mopitor-data:
